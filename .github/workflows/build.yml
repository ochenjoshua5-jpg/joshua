name: Build OJ Music Player APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clear Gradle caches
        run: |
          rm -rf ~/.gradle/caches
          rm -rf .gradle
          rm -rf build
          rm -rf app/build

      - name: Build debug APK
        run: ./gradlew :app:assembleGmsMobileUniversalDebug --stacktrace --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oj-music-player-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
