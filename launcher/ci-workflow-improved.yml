name: Build OJ MUSIC (APK + Windows launcher)

on:
  push:
    branches:
      - main
      - arena/01a10b4d-joshua
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oj-music-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
        run: ./gradlew :app:assembleGmsMobileUniversalDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: oj-music-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  windows-launcher:
    name: Windows launcher (.exe)
    runs-on: ubuntu-latest
    needs: apk
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mingw-w64
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Download APK
        uses: actions/download-artifact@v5
        with:
          name: oj-music-apk
          path: apk

      - name: Build OJ MUSIC launcher
        run: |
          APK=$(find apk -name '*.apk' | head -n 1)
          echo "Bundling: $APK"
          python3 launcher/build_launcher.py --cc x86_64-w64-mingw32-gcc --apk "$APK" --out dist/OJ-MUSIC.exe
          ls -lh dist

      - name: Upload launcher
        uses: actions/upload-artifact@v5
        with:
          name: oj-music-windows-launcher
          path: dist/*.exe
          if-no-files-found: error
